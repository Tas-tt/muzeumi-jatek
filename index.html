<!DOCTYPE html>
<html lang="hu">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múzeumi Kalandjáték</title>
    <script type="module">
        import QrScanner from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";
        window.QrScanner = QrScanner;
    </script>
</head>
<body>
    <div id="kezdo_karty" style="display:block;">

        <h1 id="cim">Múzeumi Kalandjáték</h1>

        <button id="startBtn">Játék indítása</button>

    </div>

    <hr>

    <div id="statusKartya" style="display:none;">

        <div class="statusElem">
            ⭐ Pontszám:
            <span id="pontszam">0</span>
        </div>

        <div class="statusElem">
            🔑 Kód:
            <span id="gyujtottKod"></span>
        </div>

    </div>

    <div id="jatek" style="display:none;">


<div id="keresesKartya">

    <div id="talalosKartya">

        <h2>Találós kérdés</h2>

        <p id="talalos"></p>

    </div>


    <div id="segitsegKartya">

        <h3>💡 Segítségek</h3>

        <div id="segitsegGombok">

            <button id="kepBtn">
                🖼️ Kép mutatása (-2.5 pont)
            </button>

            <button id="nevBtn">
                🏷️ Név mutatása (-2.5 pont)
            </button>

        </div>

        <img
            id="kep"
            width="300"
            style="display:none;"
        >

        <h3 id="nev"></h3>

    </div>

</div>

        <br>

        <div id="pinKartya">

            <h3>🔢 Tárgy PIN-kódja</h3>

            <p>
                Ha megtaláltad a tárgyat, írd be a rajta található PIN-kódot!
            </p>

            <input id="pinInput"
                   type="text"
                   inputmode="numeric"
                   placeholder="Írd be a PIN-kódot">

            <button id="checkPinBtn">
                Ellenőrzés
            </button>

        </div>

        <div id="quiz" style="display:none;">

            <h3 id="kerdes"></h3>

            <button id="v1"></button>
            <button id="v2"></button>
            <button id="v3"></button>

        </div>

    </div>

    <div id="uzi_karty" style="display:none">

        <p id="uzenet"></p>

    </div>

    <div id="qr_karty" style="display:none">

        <h3>QR beolvasás</h3>
        <button id="scanBtn">
            📷 Kód beolvasása
        </button>

        <div class="qr-box">
            <video id="qr-reader"></video>
        </div>

        <p id="qr-result"></p>


    </div>


    <div id="vegsoKartya" style="display:none;">

        <h2>🚪 KIJÁRAT</h2>

        <p>
            Írd be az összegyűjtött kódot!
        </p>

        <input id="vegsoKodInput">

        <br><br>

        <button id="kilepBtn">
            Kijutás
        </button>

    </div>
    <script src="script.js"></script>

    <div id="vegeUzenet">
        🎉 Sikeresen kijutottál a játékból!
    </div>

</body>
</html>
