<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Múzeumi Kalandjáték</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- ==================================================
         QR SCANNER
         ================================================== -->

    <script type="module">

        import QrScanner
            from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

        window.QrScanner = QrScanner;

    </script>

</head>


<body>


    <!-- ==================================================
         KEZDŐKÉPERNYŐ
         ================================================== -->

    <div
        id="kezdo_karty"
        style="display:block;"
    >

        <h1 id="cim">
            Múzeumi Kalandjáték
        </h1>


        <!-- ==========================================
             ÚJ JÁTÉK
             ========================================== -->

        <button id="startBtn">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5l11 7-11 7V5z"/>
            </svg>

            <span>Új játék</span>

        </button>


        <!-- ==========================================
             JÁTÉK FOLYTATÁSA
             ========================================== -->

        <button
            id="folytatasBtn"
            style="display:none;"
        >

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 0 0-14.5-4"/>
                <path d="M5 3v5h5"/>
                <path d="M4 13a8 8 0 0 0 14.5 4"/>
                <path d="M19 21v-5h-5"/>
            </svg>

            <span>Játék folytatása</span>

        </button>


        <!-- ==========================================
             MENTÉS INFORMÁCIÓ
             ========================================== -->

        <p
            id="mentesInfo"
            style="display:none;"
        >

            <svg class="ikon ikon-szoveg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h11l3 3v15H5z"/>
                <path d="M8 3v6h8V3"/>
                <path d="M8 21v-6h8v6"/>
            </svg>

            <span>Van egy korábbi mentett játékod.</span>

        </p>

    </div>



    <!-- ==================================================
         ÜZENET KÁRTYA
         ================================================== -->

    <div
        id="uzi_karty"
        style="display:none;"
    >

        <p id="uzenet"></p>

    </div>



    <hr>



    <!-- ==================================================
         JÁTÉK STÁTUSZ
         ================================================== -->

    <div
        id="statusKartya"
        style="display:none;"
    >

        <div class="statusElem">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3l2.6 5.4 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9L12 3z"/>
            </svg>

            <span>Pontszám:</span>

            <span id="pontszam">
                0
            </span>

        </div>


        <div class="statusElem">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="8" cy="15" r="4"/>
                <path d="M11 12l8-8"/>
                <path d="M16 7l2 2"/>
                <path d="M18 5l2 2"/>
            </svg>

            <span>Kód:</span>

            <span id="gyujtottKod"></span>

        </div>

    </div>



    <!-- ==================================================
         JÁTÉK
         ================================================== -->

    <div
        id="jatek"
        style="display:none;"
    >


        <!-- ==========================================
             KERESÉSI RÉSZ
             ========================================== -->

        <div id="keresesKartya">


            <!-- ======================================
                 TALÁLÓS KÉRDÉS / SEGÍTSÉG
                 ====================================== -->

            <div id="talalosKartya">

                <h2>
                    Találós kérdés
                </h2>

                <p id="talalos"></p>

            </div>



            <!-- ======================================
                 SEGÍTSÉGEK
                 ====================================== -->

<div id="segitsegKartya">

    <div id="segitsegGombok">

        <button id="kepBtn">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <circle cx="8" cy="9" r="1.5"/>
                <path d="M3 17l5-5 4 4 3-3 6 6"/>
            </svg>

            <span>
                Kép mutatása
                <br>
                (-2.5 pont)
            </span>

        </button>


        <button id="nevBtn">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h7l9 9-7 7-9-9V4z"/>
                <circle cx="8" cy="8" r="1.3"/>
            </svg>

            <span>
                Név mutatása
                <br>
                (-2.5 pont)
            </span>

        </button>

    </div>

    <img
        id="kep"
        width="300"
        style="display:none;"
        alt="Segítségkép"
    >

    <h3 id="nev"></h3>

</div>



        <!-- ==================================================
             PIN KÁRTYA
             ================================================== -->

        <div
            id="pinKartya"
            style="display:none;"
        >

            <h3>

                <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="7" cy="7" r="1"/>
                    <circle cx="12" cy="7" r="1"/>
                    <circle cx="17" cy="7" r="1"/>
                    <circle cx="7" cy="12" r="1"/>
                    <circle cx="12" cy="12" r="1"/>
                    <circle cx="17" cy="12" r="1"/>
                    <circle cx="7" cy="17" r="1"/>
                    <circle cx="12" cy="17" r="1"/>
                    <circle cx="17" cy="17" r="1"/>
                </svg>

                <span>Tárgy PIN-kódja</span>

            </h3>


            <p>

                Ha megtaláltad a tárgyat,
                írd be a rajta található PIN-kódot!

            </p>


            <input
                id="pinInput"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Írd be a PIN-kódot"
            >


            <button id="checkPinBtn">

                <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12l4 4L19 6"/>
                </svg>

                <span>Ellenőrzés</span>

            </button>

        </div>



        <!-- ==================================================
             QUIZ
             ================================================== -->

        <div
            id="quiz"
            style="display:none;"
        >

            <h3 id="kerdes"></h3>


            <button id="v1"></button>

            <button id="v2"></button>

            <button id="v3"></button>

        </div>


    </div>



    <!-- ==================================================
         QR KÁRTYA
         ================================================== -->

    <div
        id="qr_karty"
        style="display:none;"
    >

        <h3 id="qrCim">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <path d="M14 14h3v3h-3z"/>
                <path d="M19 14v3"/>
                <path d="M14 19h3"/>
                <path d="M19 19h2"/>
            </svg>

            <span>QR beolvasás</span>

        </h3>


        <button id="scanBtn">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h4l2-2h4l2 2h4v12H4V7z"/>
                <circle cx="12" cy="13" r="3.5"/>
            </svg>

            <span>Kód beolvasása</span>

        </button>



        <!-- ==========================================
             QR KAMERA
             ========================================== -->

        <div class="qr-box">

            <video
                id="qr-reader"
                playsinline
            ></video>

        </div>



        <!-- QR EREDMÉNY -->
        
        <p id="qr-result"></p>
        
        
        <!-- SOUNDCLOUD -->
                  
          <button
              id="soundcloudBtn"
              style="display:none;"
          >
              <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12v-2"/>
                  <path d="M7 15V9"/>
                  <path d="M10 17V7"/>
                  <path d="M13 15V9"/>
                  <path d="M16 13v-2"/>
                  <path d="M19 11v2"/>
              </svg>
              <span>SoundCloud meghallgatása</span>
          </button>
          
          <button
              id="soundcloudContinueBtn"
              style="display:none;"
          >
              <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5l11 7-11 7V5z"/>
              </svg>
              <span>Tovább a kérdéshez</span>
          </button>


    </div>



    <!-- ==================================================
         VÉGSŐ KÓD / KIJÁRAT
         ================================================== -->

    <div
        id="vegsoKartya"
        style="display:none;"
    >

        <h2>

            <svg class="ikon ikon-nagy" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 21V3h14v18"/>
                <path d="M9 21V7l10-2v16"/>
                <circle cx="15" cy="14" r="1"/>
            </svg>

            <span>KIJÁRAT</span>

        </h2>


        <input
            id="vegsoKodInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Kijutási kód"
        >


        <br>
        <br>


        <button id="kilepBtn">

            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0"/>
                <circle cx="12" cy="15" r="1"/>
            </svg>

            <span>Kijutás</span>

        </button>


        <!-- HIBÁS VÉGSŐ KÓD -->

        <p
            id="vegeUzenet"
            style="display:none;"
        ></p>

    </div>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script src="script.js"></script>


    <!-- ==================================================
         BIZTONSÁGI / KIEGÉSZÍTŐ VÉGEÜZENET
         ================================================= -->

    <div
        id="vegeUzenetLegacy"
        style="display:none;"
    >                    

        Sikeresen kijutottál a játékból!

    </div>


</body>

</html>
