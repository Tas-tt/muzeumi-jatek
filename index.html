<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Múzeumi Kalandjáték</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- ==================================================
         QR SCANNER
         ================================================== -->

    <script type="module">

        import QrScanner
            from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

        window.QrScanner = QrScanner;

    </script>

</head>


<body>


    <!-- ==================================================
         KEZDŐKÉPERNYŐ
         ================================================== -->

    <div
        id="kezdo_karty"
        style="display:block;"
    >

        <h1 id="cim">
            Múzeumi Kalandjáték
        </h1>


        <!-- ==========================================
             ÚJ JÁTÉK
             ========================================== -->

        <button id="startBtn">
            ▶️ Új játék
        </button>


        <!-- ==========================================
             JÁTÉK FOLYTATÁSA
             ========================================== -->

        <button
            id="folytatasBtn"
            style="display:none;"
        >
            🔄 Játék folytatása
        </button>


        <!-- ==========================================
             MENTÉS INFORMÁCIÓ
             ========================================== -->

        <p
            id="mentesInfo"
            style="display:none;"
        >
            💾 Van egy korábbi mentett játékod.
        </p>

    </div>



    <!-- ==================================================
         ÜZENET KÁRTYA
         ================================================== -->

    <div
        id="uzi_karty"
        style="display:none;"
    >

        <p id="uzenet"></p>

    </div>



    <hr>



    <!-- ==================================================
         JÁTÉK STÁTUSZ
         ================================================== -->

    <div
        id="statusKartya"
        style="display:none;"
    >

        <div class="statusElem">

            ⭐ Pontszám:

            <span id="pontszam">
                0
            </span>

        </div>


        <div class="statusElem">

            🔑 Kód:

            <span id="gyujtottKod"></span>

        </div>

    </div>



    <!-- ==================================================
         JÁTÉK
         ================================================== -->

    <div
        id="jatek"
        style="display:none;"
    >


        <!-- ==========================================
             KERESÉSI RÉSZ
             ========================================== -->

        <div id="keresesKartya">


            <!-- ======================================
                 TALÁLÓS KÉRDÉS / SEGÍTSÉG
                 ====================================== -->

            <div id="talalosKartya">

                <h2>
                    Találós kérdés
                </h2>

                <p id="talalos"></p>

            </div>



            <!-- ======================================
                 SEGÍTSÉGEK
                 ====================================== -->

            <div id="segitsegKartya">

                <h3>
                    💡 Segítségek
                </h3>


                <div id="segitsegGombok">


                    <!-- KÉP -->

                    <button id="kepBtn">

                        🖼️ Kép mutatása
                        <br>

                        (-2.5 pont)

                    </button>



                    <!-- NÉV -->

                    <button id="nevBtn">

                        🏷️ Név mutatása
                        <br>

                        (-2.5 pont)

                    </button>


                </div>



                <!-- SEGÍTSÉGKÉP -->

                <img
                    id="kep"
                    width="300"
                    style="display:none;"
                    alt="Segítségkép"
                >


                <!-- TÁRGY NEVE -->

                <h3 id="nev"></h3>


            </div>

        </div>



        <!-- ==================================================
             PIN KÁRTYA
             ================================================== -->

        <div
            id="pinKartya"
            style="display:none;"
        >

            <h3>
                🔢 Tárgy PIN-kódja
            </h3>


            <p>

                Ha megtaláltad a tárgyat,
                írd be a rajta található PIN-kódot!

            </p>


            <input
                id="pinInput"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Írd be a PIN-kódot"
            >


            <button id="checkPinBtn">

                Ellenőrzés

            </button>

        </div>



        <!-- ==================================================
             QUIZ
             ================================================== -->

        <div
            id="quiz"
            style="display:none;"
        >

            <h3 id="kerdes"></h3>


            <button id="v1"></button>

            <button id="v2"></button>

            <button id="v3"></button>

        </div>


    </div>



    <!-- ==================================================
         QR KÁRTYA
         ================================================== -->

    <div
        id="qr_karty"
        style="display:none;"
    >

        <h3>
            📷 QR beolvasás
        </h3>


        <button id="scanBtn">

            📷 Kód beolvasása

        </button>



        <!-- ==========================================
             QR KAMERA
             ========================================== -->

        <div class="qr-box">

            <video
                id="qr-reader"
                playsinline
            ></video>

        </div>



        <!-- QR EREDMÉNY -->

        <p id="qr-result"></p>


    </div>



    <!-- ==================================================
         VÉGSŐ KÓD / KIJÁRAT
         ================================================== -->

    <div
        id="vegsoKartya"
        style="display:none;"
    >

        <h2>
            🚪 KIJÁRAT
        </h2>


        <p>

            Írd be az összegyűjtött kódot!

        </p>


        <input
            id="vegsoKodInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Kijutási kód"
        >


        <br>
        <br>


        <button id="kilepBtn">

            🔓 Kijutás

        </button>


        <!-- HIBÁS VÉGSŐ KÓD -->

        <p
            id="vegeUzenet"
            style="display:none;"
        ></p>

    </div>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script src="script.js"></script>


    <!-- ==================================================
         BIZTONSÁGI / KIEGÉSZÍTŐ VÉGEÜZENET
         ================================================== -->

    <div
        id="vegeUzenetLegacy"
        style="display:none;"
    >

        🎉 Sikeresen kijutottál a játékból!

    </div>


</body>

</html>
